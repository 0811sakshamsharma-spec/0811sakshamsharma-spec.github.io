<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — Wamsgoat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0d0d0d;
      --bg-surface: #1a1a1a;
      --line: #333333;
      --pink: #f4b8ca;
      --pink-dim: #a97e88;
      --text: #ededed;
      --muted: #969696;
      --font-display: 'Archivo Black', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-deep);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 15% 10%, rgba(244, 184, 202, 0.05), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(150, 150, 150, 0.04), transparent 45%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background: var(--pink);
      color: var(--bg-deep);
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 32px;
      width: 100%;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(10px);
      background: rgba(18, 16, 14, 0.85);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 32px;
      max-width: 1120px;
      margin: 0 auto;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 1.15rem;
      letter-spacing: 0.04em;
      color: var(--pink);
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 28px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    nav a {
      color: var(--muted);
      transition: color 0.2s ease;
    }

    nav a:hover,
    nav a.active {
      color: var(--pink);
    }

    /* Centered Big Text Container */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 32px;
      text-align: center;
    }

    .about-heading {
      font-family: var(--font-display);
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      line-height: 1.1;
      letter-spacing: 0.02em;
      word-spacing: 0.08em;
      color: var(--pink);
      text-shadow: 0 0 40px rgba(244, 184, 202, 0.15);
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--line);
      padding: 24px 0;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--muted);
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 32px;
    }

    .footer-inner a:hover {
      color: var(--pink);
    }
  </style>
</head>

<body>

  <header>
    <div class="nav-inner">
      <a href="index.html" class="logo">WAMSGOAT</a>
      <nav>
        <ul>
          <li><a href="mice.html">Mice</a></li>
          <li><a href="mousepads.html">Mousepads</a></li>
          <li><a href="accessories.html">Accessories</a></li>
          <li><a href="about.html" class="active">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="about-heading">I'm a no name</h1>
  </main>

  <footer>
    <div class="footer-inner">
      <span>© 2026 Wamsgoat.</span>
      <span><a href="index.html">Home</a> · <a href="mice.html">Mice</a></span>
    </div>
  </footer>

</body>

</html>
